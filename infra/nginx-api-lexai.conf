# SmartLex API — nginx server-block (VPS 185.191.141.146).
# Joylashuv: /etc/nginx/sites-available/api.lexai.com.uz  → sites-enabled ga symlink.
# API 127.0.0.1:3001 da ishlaydi (API_PORT). TLS'ni certbot qo'shadi:
#   sudo certbot --nginx -d api.lexai.com.uz
#
# One-ID redirect_uri = https://api.lexai.com.uz/auth/oneid/callback shu blok orqali keladi.

server {
    listen 80;
    server_name api.lexai.com.uz;

    # Katta hujjat yuklashlar uchun
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
