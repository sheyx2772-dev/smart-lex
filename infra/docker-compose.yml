services:
  postgres:
    image: postgres:16-alpine
    container_name: lex-postgres
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: lex
      POSTGRES_PASSWORD: lex
      POSTGRES_DB: lex
    volumes: ["./.data/pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lex -d lex"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: lex-redis
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    container_name: lex-minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: lexminio
      MINIO_ROOT_PASSWORD: lexminio123
    volumes: ["./.data/minio:/data"]
