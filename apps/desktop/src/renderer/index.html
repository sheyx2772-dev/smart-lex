<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
    <title>SmartLex Desktop</title>
    <style>
      :root { --brand: #4f46e5; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #0f172a; background: #f8fafc; }
      header { display: flex; align-items: center; gap: 10px; padding: 14px 20px; background: linear-gradient(135deg, #4f46e5, #6366f1); color: #fff; font-weight: 700; }
      main { padding: 22px; max-width: 900px; margin: 0 auto; }
      .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
      label { display: block; font-size: 12px; color: #64748b; margin: 8px 0 4px; }
      input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; }
      button { padding: 10px 16px; border: 0; border-radius: 10px; background: var(--brand); color: #fff; font-weight: 600; cursor: pointer; }
      button.ghost { background: #eef2ff; color: #4338ca; }
      button:disabled { opacity: .5; cursor: default; }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
      .muted { color: #64748b; font-size: 12px; }
      .hidden { display: none; }
      .note { font-size: 12.5px; color: #475569; margin-top: 10px; line-height: 1.6; }
      .ok { color: #15803d; } .err { color: #dc2626; }
    </style>
  </head>
  <body>
    <header><span>◆</span> SmartLex Desktop</header>
    <main>
      <!-- Login -->
      <section id="loginCard" class="card">
        <h3 style="margin:0 0 6px">Hisobga kirish</h3>
        <label>Elektron pochta</label>
        <input id="email" type="email" placeholder="admin@lexai.com.uz" />
        <label>Parol</label>
        <input id="password" type="password" placeholder="••••••••" />
        <div style="margin-top:14px"><button id="loginBtn">Kirish</button></div>
        <div id="loginMsg" class="note"></div>
      </section>

      <!-- Da'volar -->
      <section id="claimsCard" class="card hidden">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h3 style="margin:0">Sudga tayyor da'volar</h3>
          <button class="ghost" id="refreshBtn">Yangilash</button>
        </div>
        <div id="claimsList"></div>
        <button id="testBtn" style="width:100%;margin-top:12px;background:#eef2ff;color:#4338ca">🧪 Test da'vo bilan sinash (cabinet.sud.uz)</button>
        <div class="note">
          «Sudga to'ldirish» — brauzer ochiladi, cabinet.sud.uz formasi to'ldiriladi.
          Birinchi marta E-IMZO bilan kiring (sessiya saqlanadi). Imzoni o'zingiz tasdiqlaysiz.
        </div>
      </section>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
