<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { width: 280px; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #0f172a; }
      .head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; color: #fff; font-weight: 700; background: linear-gradient(135deg, #4f46e5, #6366f1); }
      .body { padding: 14px; font-size: 13px; line-height: 1.6; }
      .muted { color: #64748b; font-size: 12px; }
      .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
      .row b { font-weight: 600; }
      .empty { color: #64748b; }
      .foot { padding: 0 14px 14px; }
      button { width: 100%; padding: 9px; border: 1px solid #e2e8f0; border-radius: 10px; background: #f8fafc; font-size: 12.5px; font-weight: 600; cursor: pointer; }
      button:hover { border-color: #cbd5e1; }
      ol { margin: 8px 0 0; padding-left: 18px; color: #475569; font-size: 12px; line-height: 1.7; }
      .chk { display: flex; align-items: center; gap: 8px; padding: 10px 0 12px; font-size: 12.5px; color: #334155; cursor: pointer; }
      .chk input { width: auto; accent-color: #4f46e5; }
    </style>
  </head>
  <body>
    <div class="head"><span>◆</span> SmartLex.AI</div>
    <div class="body" id="content"><p class="empty">Yuklanmoqda…</p></div>
    <div class="foot">
      <label class="chk"><input type="checkbox" id="autofill" /> Sayt ochilganda avtomatik to'ldirish</label>
      <button id="clear">Tozalash</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
